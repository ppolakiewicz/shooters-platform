services:
  postgres:
    image: postgres:18.3-alpine
    container_name: shooters-platform-postgres
    environment:
      POSTGRES_DB: shooters_platform
      POSTGRES_USER: shooters
      POSTGRES_PASSWORD: shooters
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shooters -d shooters_platform"]
      interval: 5s
      timeout: 3s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:9.15
    container_name: shooters-platform-pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@shooters.com
      PGADMIN_DEFAULT_PASSWORD: shooters
      PGADMIN_DISABLE_POSTFIX: "true"
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "true"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro

volumes:
  postgres-data:
  pgadmin-data:
