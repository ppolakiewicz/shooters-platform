<main class="shell">
  <section class="status-panel" aria-labelledby="app-title">
    <div>
      <p class="eyebrow">{{ 'app.brand' | translate }}</p>
      <h1 id="app-title">{{ 'home.title' | translate }}</h1>
      <p class="signed-in">{{ 'home.signedInAs' | translate:{ username: auth.currentUser()?.username ?? '' } }}</p>
    </div>

    <div class="actions">
      <a mat-flat-button routerLink="/bookings">
        <mat-icon aria-hidden="true">event_available</mat-icon>
        {{ 'nav.bookings' | translate }}
      </a>

        <a mat-stroked-button routerLink="/booking-terms">
            <mat-icon aria-hidden="true">calendar_month</mat-icon>
            {{ 'bookings.publicTerms' | translate }}
        </a>

      <button mat-stroked-button type="button" (click)="logout()" [disabled]="signingOut()">
        <mat-icon aria-hidden="true">logout</mat-icon>
        {{ 'nav.logout' | translate }}
      </button>
    </div>
  </section>
</main>
